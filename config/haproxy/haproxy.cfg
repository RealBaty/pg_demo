global
    maxconn 1000
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    # Live classroom demos keep psql transactions open while the instructor talks.
    timeout client  30m
    timeout server  30m

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

listen postgres_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-node-1 pg-node-1:5432 maxconn 200 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 200 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 200 check port 8008

listen postgres_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-node-1 pg-node-1:5432 maxconn 200 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 200 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 200 check port 8008
