name: ${COMPOSE_PROJECT_NAME:-pgha-demo}

services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pg-ha-demo
      - --enable-v2=true
    environment:
      ETCDCTL_API: "3"
    volumes:
      - etcd-1-data:/etcd-data
    networks:
      - ha

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pg-ha-demo
      - --enable-v2=true
    environment:
      ETCDCTL_API: "3"
    volumes:
      - etcd-2-data:/etcd-data
    networks:
      - ha

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pg-ha-demo
      - --enable-v2=true
    environment:
      ETCDCTL_API: "3"
    volumes:
      - etcd-3-data:/etcd-data
    networks:
      - ha

  pg-node-1:
    build:
      context: ./docker/patroni
    image: pg-ha-demo-patroni:local
    hostname: pg-node-1
    environment:
      PATRONI_NAME: pg-node-1
      PATRONI_SCOPE: pg-ha-demo
      PATRONI_ETCD_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
      PGDATA: /var/lib/postgresql/data
    command: ["/usr/local/bin/patroni-entrypoint.sh"]
    volumes:
      - pg-node-1-data:/var/lib/postgresql/data
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3
    networks:
      - ha

  pg-node-2:
    image: pg-ha-demo-patroni:local
    hostname: pg-node-2
    environment:
      PATRONI_NAME: pg-node-2
      PATRONI_SCOPE: pg-ha-demo
      PATRONI_ETCD_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
      PGDATA: /var/lib/postgresql/data
    command: ["/usr/local/bin/patroni-entrypoint.sh"]
    volumes:
      - pg-node-2-data:/var/lib/postgresql/data
    depends_on:
      - pg-node-1
      - etcd-1
      - etcd-2
      - etcd-3
    networks:
      - ha

  pg-node-3:
    image: pg-ha-demo-patroni:local
    hostname: pg-node-3
    environment:
      PATRONI_NAME: pg-node-3
      PATRONI_SCOPE: pg-ha-demo
      PATRONI_ETCD_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
      PGDATA: /var/lib/postgresql/data
    command: ["/usr/local/bin/patroni-entrypoint.sh"]
    volumes:
      - pg-node-3-data:/var/lib/postgresql/data
    depends_on:
      - pg-node-1
      - etcd-1
      - etcd-2
      - etcd-3
    networks:
      - ha

  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "${WRITE_PORT:-15000}:5000"
      - "${READ_PORT:-15001}:5001"
      - "${HAPROXY_STATS_PORT:-17000}:7000"
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pg-node-1
      - pg-node-2
      - pg-node-3
    networks:
      - ha

  pgbouncer-write:
    build:
      context: ./docker/pgbouncer
    image: pg-ha-demo-pgbouncer:local
    environment:
      PGBOUNCER_TARGET_HOST: haproxy
      PGBOUNCER_TARGET_PORT: "5000"
      PGBOUNCER_LISTEN_PORT: "6432"
    ports:
      - "${PGBOUNCER_WRITE_PORT:-16432}:6432"
    depends_on:
      - haproxy
    networks:
      - ha

  pgbouncer-read:
    image: pg-ha-demo-pgbouncer:local
    environment:
      PGBOUNCER_TARGET_HOST: haproxy
      PGBOUNCER_TARGET_PORT: "5001"
      PGBOUNCER_LISTEN_PORT: "6432"
    ports:
      - "${PGBOUNCER_READ_PORT:-16433}:6432"
    depends_on:
      - haproxy
    networks:
      - ha

  client:
    image: pg-ha-demo-patroni:local
    command: ["sleep", "infinity"]
    working_dir: /demo
    environment:
      PATRONICTL_CONFIG: /demo/config/patronictl.yml
      ADMIN_URL: postgresql://postgres:postgres@haproxy:5000/postgres
      DEMO_DIRECT_URL: postgresql://demo:demo@haproxy:5000/demo
      DEMO_WRITE_URL: postgresql://demo:demo@pgbouncer-write:6432/demo
      DEMO_READ_URL: postgresql://demo:demo@pgbouncer-read:6432/demo
      BENCH_DIRECT_URL: postgresql://demo:demo@haproxy:5000/bench
      BENCH_URL: postgresql://demo:demo@pgbouncer-write:6432/bench
      PGBENCH_TIME: ${PGBENCH_TIME:-20}
      PGBENCH_SCALE: ${PGBENCH_SCALE:-5}
      DEMO_PAUSE: ${DEMO_PAUSE:-1}
    volumes:
      - .:/demo:ro
    depends_on:
      - pgbouncer-write
      - pgbouncer-read
    networks:
      - ha

networks:
  ha:

volumes:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  pg-node-1-data:
  pg-node-2-data:
  pg-node-3-data:
